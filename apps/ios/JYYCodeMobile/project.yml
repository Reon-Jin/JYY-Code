name: JYYCodeMobile
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: ai.jyycode.mobile
targets:
  JYYCodeMobile:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a JYYCode desktop pairing QR code.
    entitlements:
      path: JYYCodeMobile.entitlements
    dependencies:
      - sdk: UserNotifications.framework
      - sdk: LocalAuthentication.framework
      - sdk: AVFoundation.framework
  JYYCodeMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: JYYCodeMobile
