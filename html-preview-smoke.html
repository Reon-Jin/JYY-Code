<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>HTML Preview Smoke</title>
    <style>
      #box { width: 80px; height: 80px; background: #16a34a; animation: pulse 0.4s ease-in-out infinite alternate; }
      @keyframes pulse { from { transform: translateX(0) scale(0.8); } to { transform: translateX(120px) scale(1.1); } }
    </style>
  </head>
  <body>
    <p id="status">WAITING</p>
    <div id="box"></div>
    <button id="action" onclick="this.textContent = 'CLICK_OK'; document.getElementById('status').textContent = 'INTERACTION_OK'">CLICK_ME</button>
    <script>
      const box = document.getElementById("box")
      box.addEventListener("animationiteration", () => {
        if (document.getElementById("status").textContent === "WAITING") {
          document.getElementById("status").textContent = "ANIMATION_OK"
        }
      })
    </script>
  </body>
</html>
