<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>JYYCode</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-width: 320px;
        height: 100%;
        min-height: 100%;
        margin: 0;
        background: #181818;
      }

      [data-startup-shell="true"] {
        display: grid;
        width: 100%;
        height: 100%;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: #181818;
        color: #a1a1a1;
        font:
          14px/1.5 "Segoe UI",
          sans-serif;
        letter-spacing: 0.01em;
      }

      [data-startup-shell="true"]::before {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #f2f2f2;
        box-shadow: 0 0 0 7px rgb(255 255 255 / 7%);
        content: "";
        animation: startup-pulse 1.2s ease-in-out infinite alternate;
      }

      [data-startup-shell="true"][data-failed="true"]::before {
        background: #f87171;
        animation: none;
      }

      [data-startup-shell="true"] strong {
        color: #f2f2f2;
        font-size: 16px;
      }

      [data-startup-shell="true"] p {
        max-width: 420px;
        margin: 0;
        text-align: center;
      }

      [data-startup-shell="true"] button {
        min-height: 36px;
        border: 1px solid #454545;
        border-radius: 10px;
        padding: 0 16px;
        background: #262626;
        color: #f2f2f2;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
      }

      @keyframes startup-pulse {
        to {
          opacity: 0.45;
          transform: scale(0.8);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main data-startup-shell="true" role="status" aria-live="polite">正在启动 JYYCode…</main>
    </div>
    <script vite-ignore src="./startup-watchdog.js"></script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
