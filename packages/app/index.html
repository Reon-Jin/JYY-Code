<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>JYYCode</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-width: 320px;
        height: 100%;
        min-height: 100%;
        margin: 0;
        background: #07111f;
      }

      [data-startup-shell="true"] {
        display: grid;
        width: 100%;
        height: 100%;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background:
          radial-gradient(circle at 48% 46%, rgb(34 201 151 / 8%), transparent 24rem),
          linear-gradient(135deg, #07111f 0%, #09192a 100%);
        color: #8da2b8;
        font: 14px/1.5 "Segoe UI", sans-serif;
        letter-spacing: 0.01em;
      }

      [data-startup-shell="true"]::before {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #22c997;
        box-shadow: 0 0 0 7px rgb(34 201 151 / 8%);
        content: "";
        animation: startup-pulse 1.2s ease-in-out infinite alternate;
      }

      @keyframes startup-pulse {
        to { opacity: 0.45; transform: scale(0.8); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main data-startup-shell="true" role="status" aria-live="polite">正在启动 JYYCode…</main>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
