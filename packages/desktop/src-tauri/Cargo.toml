[package]
name = "jyycode-desktop"
version = "1.0.0"
description = "JYYCode desktop application"
edition = "2024"

[lib]
name = "jyycode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rand = "=0.10.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-store = "=2.4.3"
tauri-plugin-updater = "=2.10.1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
notify-rust = "=4.18.0"
windows-version = "=0.1.7"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }
