name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Test Desktop UI
        run: bun run --cwd packages/app test

      - name: Typecheck Desktop UI
        run: bun run --cwd packages/app typecheck

      - name: Build Desktop UI
        run: bun run --cwd packages/app build

      - name: Enforce Desktop UI budgets
        run: bun run --cwd packages/app budget

      - name: Upload Desktop UI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-diagnostics
          if-no-files-found: warn
          path: |
            packages/app/dist/performance-summary.json
            packages/app/test-results/**
            packages/app/screenshots/**

      - name: Test Desktop release scripts
        run: bun run --cwd packages/desktop test

  core-process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable 2026-08-05
        with:
          toolchain: stable

      - name: Test process guardian
        run: cargo test --manifest-path packages/process-guardian/Cargo.toml

      - name: Typecheck core
        run: bun run --cwd packages/core typecheck

      - name: Test process supervision
        run: bun run --cwd packages/core test --timeout 60000 test/effect/cross-spawn-spawner.test.ts test/process/process.test.ts
