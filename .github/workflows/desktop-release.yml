name: desktop-release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-13
        with:
          targets: x86_64-pc-windows-msvc

      - name: Validate release tag and secrets
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^desktop-v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Invalid desktop release tag: $tag"
          }
          $version = $Matches[1]
          $configured = (Get-Content packages/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($configured -ne $version) { throw "Tag version $version does not match Tauri version $configured" }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "Missing TAURI_SIGNING_PRIVATE_KEY" }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate source
        run: |
          bun turbo typecheck
          bun run --cwd packages/app test
          bun run --cwd packages/desktop test
          cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml

      - name: Build signed updater artifacts
        shell: pwsh
        run: bun run --cwd packages/desktop build -- --target x86_64-pc-windows-msvc --config src-tauri/tauri.release.conf.json

      - name: Smoke-test and prepare artifacts
        shell: pwsh
        run: ./packages/desktop/script/smoke-windows.ps1 -ArtifactVersion $env:VERSION -RequireUpdaterSignatures

      - name: Create update manifest and checksums
        shell: pwsh
        run: |
          $root = "packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/desktop-artifacts"
          $installers = @(Get-ChildItem $root -Filter "*.exe" | Where-Object Name -ne "JYYCode-portable-x64.exe")
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          $installer = $installers[0]
          $signature = Get-Item "$($installer.FullName).sig"
          bun packages/desktop/script/create-update-manifest.ts `
            --version "$env:VERSION" `
            --repository "${{ github.repository }}" `
            --tag "${{ github.ref_name }}" `
            --installer-name "$($installer.Name)" `
            --signature "$($signature.FullName)" `
            --notes "JYYCode Desktop $env:VERSION" `
            --pub-date "$([DateTime]::UtcNow.ToString('o'))" `
            --output "$root/latest.json"
          $files = Get-ChildItem $root -File | Where-Object Name -ne "SHA256SUMS.txt"
          $checksums = $files | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) *$($_.Name)"
          }
          Set-Content "$root/SHA256SUMS.txt" $checksums -Encoding ascii

      - name: Create immutable Desktop prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Resolve-Path "packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/desktop-artifacts"
          $assets = Get-ChildItem $root -File | Select-Object -ExpandProperty FullName
          gh release create "${{ github.ref_name }}" @assets `
            --repo "${{ github.repository }}" `
            --title "JYYCode Desktop $env:VERSION" `
            --notes "Windows x64 prerelease. The updater artifacts are signed, but Windows Authenticode signing is not yet configured, so SmartScreen may show an unknown publisher warning." `
            --prerelease `
            --verify-tag

      - name: Update rolling Desktop manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Resolve-Path "packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/desktop-artifacts/latest.json"
          if (gh release view desktop-latest --repo "${{ github.repository }}" 2>$null) {
            gh release upload desktop-latest $manifest --clobber --repo "${{ github.repository }}"
          } else {
            gh release create desktop-latest $manifest `
              --repo "${{ github.repository }}" `
              --title "JYYCode Desktop update channel" `
              --notes "Rolling signed update manifest. Download installers from the versioned Desktop releases." `
              --prerelease
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JYYCode-desktop-${{ env.VERSION }}-windows-x64
          path: packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/desktop-artifacts/*
          if-no-files-found: error
          retention-days: 30
