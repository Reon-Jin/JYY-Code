name: desktop-release
run-name: Desktop v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 1.0.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      TAG: desktop-v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable 2026-08-05
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build and verify Windows process guardian
        shell: pwsh
        run: |
          cargo build --release --manifest-path packages/process-guardian/Cargo.toml --target x86_64-pc-windows-msvc
          $guardian = "packages/process-guardian/target/x86_64-pc-windows-msvc/release/jyycode-process-guardian.exe"
          if (!(Test-Path -LiteralPath $guardian) -or ((Get-Item -LiteralPath $guardian).Length -le 0)) { throw "Missing process guardian: $guardian" }
          (Get-FileHash -LiteralPath $guardian -Algorithm SHA256).Hash

      - name: Validate version and secrets
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Invalid version: $env:VERSION" }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "Missing TAURI_SIGNING_PRIVATE_KEY" }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }
          if (gh release view $env:TAG --repo "${{ github.repository }}" 2>$null) { throw "Release $env:TAG already exists" }
          if (git tag --list $env:TAG) { throw "Tag $env:TAG already exists" }

      - name: Set version and install dependencies
        shell: pwsh
        run: |
          bun packages/desktop/script/set-release-version.ts $env:VERSION
          bun install --frozen-lockfile

      - name: Run quick release checks
        run: bun run --cwd packages/desktop test

      - name: Build signed Windows artifacts
        shell: pwsh
        run: bun run --cwd packages/desktop build -- --target x86_64-pc-windows-msvc --config src-tauri/tauri.release.conf.json

      - name: Verify Windows artifacts
        shell: pwsh
        run: ./packages/desktop/script/smoke-windows.ps1 -ArtifactVersion $env:VERSION -RequireUpdaterSignatures

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/desktop-artifacts
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable 2026-08-05
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build and verify macOS process guardian
        shell: bash
        run: |
          cargo build --release --manifest-path packages/process-guardian/Cargo.toml --target aarch64-apple-darwin
          test -s packages/process-guardian/target/aarch64-apple-darwin/release/jyycode-process-guardian
          shasum -a 256 packages/process-guardian/target/aarch64-apple-darwin/release/jyycode-process-guardian

      - name: Validate version and secrets
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version: $VERSION" >&2; exit 1; }
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]] || { echo "Missing TAURI_SIGNING_PRIVATE_KEY" >&2; exit 1; }
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]] || { echo "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD" >&2; exit 1; }

      - name: Set version and install dependencies
        shell: bash
        run: |
          bun packages/desktop/script/set-release-version.ts "$VERSION"
          bun install --frozen-lockfile

      - name: Build signed macOS artifacts
        shell: bash
        run: bun run --cwd packages/desktop build -- --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json

      - name: Verify macOS artifacts
        shell: bash
        run: bash packages/desktop/script/smoke-macos.sh "packages/desktop/src-tauri/target/aarch64-apple-darwin/release"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: packages/desktop/src-tauri/target/aarch64-apple-darwin/release/desktop-artifacts
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos]
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      TAG: desktop-v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: release-assets/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: release-assets/macos

      - name: Verify artifacts and create updater manifest
        shell: pwsh
        run: |
          $root = Resolve-Path "release-assets"
          $windows = Resolve-Path "release-assets/windows"
          $macos = Resolve-Path "release-assets/macos"
          $windowsInstaller = @(Get-ChildItem $windows -Filter "*-setup.exe" -File)
          $windowsSignature = @(Get-ChildItem $windows -Filter "*-setup.exe.sig" -File)
          $macInstaller = @(Get-ChildItem $macos -Filter "*.app.tar.gz" -File)
          $macSignature = @(Get-ChildItem $macos -Filter "*.app.tar.gz.sig" -File)
          if ($windowsInstaller.Count -ne 1 -or $windowsSignature.Count -ne 1) { throw "Expected one Windows updater artifact and signature" }
          if ($macInstaller.Count -ne 1 -or $macSignature.Count -ne 1) { throw "Expected one macOS updater artifact and signature" }
          Copy-Item "$windows\*" $root -Force
          Copy-Item "$macos\*" $root -Force
          bun packages/desktop/script/create-update-manifest.ts `
            --version "$env:VERSION" `
            --repository "${{ github.repository }}" `
            --tag "$env:TAG" `
            --installer-name "$($windowsInstaller[0].Name)" `
            --signature "$($windowsSignature[0].FullName)" `
            --mac-installer-name "$($macInstaller[0].Name)" `
            --mac-signature "$($macSignature[0].FullName)" `
            --notes "JYYCode Desktop $env:VERSION for Windows x64 and Apple Silicon macOS" `
            --pub-date "$([DateTime]::UtcNow.ToString('o'))" `
            --output "$root/latest.json"
          $files = Get-ChildItem $root -File | Where-Object Name -ne "SHA256SUMS.txt"
          $checksums = $files | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) *$($_.Name)"
          }
          Set-Content "$root/SHA256SUMS.txt" $checksums -Encoding ascii

      - name: Publish Desktop release
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $root = Resolve-Path "release-assets"
          $assets = Get-ChildItem $root -File | Select-Object -ExpandProperty FullName
          $manifest = Join-Path $root "latest.json"
          $backupDir = Join-Path $env:RUNNER_TEMP "desktop-latest-backup"
          New-Item $backupDir -ItemType Directory -Force | Out-Null

          # Clean up leftover draft releases from previous failed runs. Drafts have no
          # tag ref, so "gh release view" cannot see them, but "gh release create"
          # still collides with them ("a release with the same tag name already exists").
          $drafts = gh api "repos/$repo/releases?per_page=100" --jq '[.[] | select(.draft) | {id, tag_name}]' | ConvertFrom-Json
          foreach ($draft in @($drafts)) {
            if ($draft -and ($draft.tag_name -eq "desktop-latest" -or $draft.tag_name -eq $env:TAG)) {
              Write-Host "Deleting leftover draft release: $($draft.tag_name) (id $($draft.id))"
              gh api -X DELETE "repos/$repo/releases/$($draft.id)"
            }
          }

          # Detect the rolling channel release via the REST API instead of
          # "gh release view": a spurious detection failure sends the script down
          # the create path, which then collides with the existing release
          # ("a release with the same tag name already exists").
          $rollingRelease = gh api "repos/$repo/releases/tags/desktop-latest" 2>$null
          $hadRollingRelease = $LASTEXITCODE -eq 0 -and $rollingRelease -and (($rollingRelease | ConvertFrom-Json).tag_name -eq "desktop-latest")
          if ($hadRollingRelease) {
            gh release download desktop-latest --pattern latest.json --dir $backupDir --clobber --repo $repo
          }

          $createdRollingRelease = $false
          $PSNativeCommandUseErrorActionPreference = $true
          try {
            $releaseNotes = @"
          Windows x64 and Apple Silicon macOS release. Tauri updater artifacts are signed; Windows Authenticode and Apple Developer ID notarization are not configured yet.

          ## Code signing policy

          Free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/). SignPath signing is not active yet; Windows installers are not Authenticode-signed and macOS artifacts are not notarized.

          - Code signing policy: https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING_POLICY.md
          - Privacy policy: https://github.com/${{ github.repository }}/blob/main/PRIVACY.md
          "@
            gh release create $env:TAG @assets `
              --repo $repo `
              --target "${{ github.sha }}" `
              --title "JYYCode Desktop $env:VERSION" `
              --notes $releaseNotes `
              --draft

            # Publish the versioned release BEFORE updating the rolling channel
            # manifest. Otherwise there is a window where desktop-latest already
            # points at assets that are still inside a private draft, and updater
            # downloads fail immediately with 404.
            gh release edit $env:TAG --repo $repo --draft=false

            if ($hadRollingRelease) {
              gh release upload desktop-latest $manifest --clobber --repo $repo
            } else {
              $channelNotes = @"
          Rolling updater manifest for JYYCode Desktop.

          Code signing policy: https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING_POLICY.md
          Privacy policy: https://github.com/${{ github.repository }}/blob/main/PRIVACY.md
          "@
              try {
                gh release create desktop-latest $manifest `
                  --repo $repo `
                  --title "JYYCode Desktop update channel" `
                  --notes $channelNotes `
                  --prerelease
                $createdRollingRelease = $true
              } catch {
                # Detection missed an existing channel release (e.g. transient API
                # error) — overwrite its manifest asset instead of failing the run.
                Write-Host "desktop-latest already exists; updating its manifest asset instead"
                gh release upload desktop-latest $manifest --clobber --repo $repo
                $hadRollingRelease = $true
              }
            }
          } catch {
            $failure = $_
            $PSNativeCommandUseErrorActionPreference = $false
            if ($hadRollingRelease) {
              gh release upload desktop-latest (Join-Path $backupDir "latest.json") --clobber --repo $repo
            } elseif ($createdRollingRelease) {
              gh release delete desktop-latest --yes --repo $repo
            }
            $isDraft = gh release view $env:TAG --repo $repo --json isDraft --jq .isDraft 2>$null
            if ($isDraft -eq "true") {
              gh release delete $env:TAG --cleanup-tag --yes --repo $repo
            }
            throw $failure
          }
