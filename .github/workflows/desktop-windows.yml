name: desktop-windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-windows.yml"
      - "packages/app/**"
      - "packages/core/**"
      - "packages/desktop/**"
      - "packages/jyycode/**"
      - "packages/sdk/**"
      - "bun.lock"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-13
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun turbo typecheck

      - name: Test desktop UI
        run: bun run --cwd packages/app test

      - name: Test desktop shell
        run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml

      - name: Stage backend sidecar
        run: bun run --cwd packages/desktop stage:sidecar

      - name: Build desktop UI
        run: bun run --cwd packages/app build

      - name: Build Windows installers
        run: bun run --cwd packages/desktop build -- --target x86_64-pc-windows-msvc

      - name: Smoke-test and prepare release artifacts
        shell: pwsh
        run: ./packages/desktop/script/smoke-windows.ps1

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JYYCode-windows-x64
          path: packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/desktop-artifacts/*
          if-no-files-found: error
          retention-days: 14
